name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers uses the runner's Docker daemon for the integration tests.
      - name: Build and run tests
        run: mvn -B clean verify

      - name: Build Docker image
        run: docker build -t imofind-api:ci .
