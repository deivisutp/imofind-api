<!DOCTYPE html>
<html lang="pt-br">
<body>
  <section class="property-grid">
    <article class="property-card">
      <div class="property-card__media">
        <div class="property-card__slides">
          <img class="property-card__photo is-active"
               src="https://barbieriimobiliaria.com.br/upl/arquivos/1006194_grande.jpg" alt="Imóvel em Blumenau">
        </div>
        <span class="property-card__badge">Apartamento</span>
      </div>
      <div class="property-card__body">
        <div class="property-card__row">
          <h3 class="property-card__location">Blumenau, Água Verde</h3>
          <span class="property-card__ref">REF: 6654</span>
        </div>
        <ul class="property-card__specs">
          <li>2 quartos</li>
          <li>-</li>
          <li>58 m²</li>
        </ul>
        <p class="property-card__price">R$&nbsp;399.000,00</p>
      </div>
      <a class="property-card__overlay"
         href="https://www.barbieriimobiliaria.com.br/imovel/apartamento-gua-verde-blumenau-sc/6654" target="_blank"></a>
    </article>

    <article class="property-card">
      <div class="property-card__media">
        <div class="property-card__slides">
          <img class="property-card__photo is-active"
               src="https://barbieriimobiliaria.com.br/upl/arquivos/2001234_grande.jpg" alt="Imóvel em Porto Belo">
        </div>
        <span class="property-card__badge">Casa</span>
      </div>
      <div class="property-card__body">
        <div class="property-card__row">
          <h3 class="property-card__location">Porto Belo, Balneário Perequê</h3>
          <span class="property-card__ref">REF: 7001</span>
        </div>
        <ul class="property-card__specs">
          <li>3 quartos</li>
          <li>2 vagas</li>
          <li>120 m²</li>
        </ul>
        <p class="property-card__price">R$&nbsp;1.250.000,00</p>
      </div>
      <a class="property-card__overlay"
         href="https://www.barbieriimobiliaria.com.br/imovel/casa-perequê-porto-belo-sc/7001" target="_blank"></a>
    </article>
  </section>
</body>
</html>
