#datasource (PostgreSQL/PostGIS; sobrescreva via variaveis de ambiente)
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/imofind}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:imofind}
spring.datasource.password=${DB_PASSWORD:imofind}

#hibernate (o schema e de responsabilidade do Flyway)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#hikari
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=28800000
spring.datasource.hikari.pool-name=POOL_PG

#actuator + metricas
management.endpoints.web.exposure.include=health,info,metrics
management.metrics.tags.application=imofind-api